---
- name: Create log directory
  ansible.builtin.file:
    path: "{{ bind_log_directory }}"
    state: directory
    owner: "{{ bind_user }}"
    group: "{{ bind_group }}"
    mode: "0755"
  when: bind_logging_enabled
  tags: [logging]

- name: Configure BIND logging
  ansible.builtin.template:
    src: logging.conf.j2
    dest: "{{ bind_config_path }}/logging.conf"
    owner: root
    group: "{{ bind_group }}"
    mode: "0644"
  when: bind_logging_enabled
  notify: Reload bind
  tags: [logging]

- name: Include logging configuration in named.conf
  ansible.builtin.lineinfile:
    path: "{{ bind_config_path }}/named.conf"
    line: 'include "{{ bind_config_path }}/logging.conf";'
    insertafter: EOF
    state: present
  when: bind_logging_enabled
  notify: Reload bind
  tags: [logging]
