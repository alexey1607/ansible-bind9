---
- name: Install BIND packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop: "{{ bind_packages }}"
  tags: [install]

- name: Create zones directory
  ansible.builtin.file:
    path: "{{ zones_folder }}"
    state: directory
    owner: "{{ bind_user }}"
    group: "{{ bind_group }}"
    mode: "0755"
  tags: [install]
